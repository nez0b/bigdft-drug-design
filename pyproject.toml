[project]
name = "bigdft-wavelet-qc"
version = "0.2.0"
description = "Reproducible BigDFT wavelet-integral to VQE, QSCI, and SQD research pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyscf>=2.6",
    "qiskit>=2.5,<3",
    "qiskit-addon-sqd>=0.12,<0.13",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9", "PyWavelets>=1.6"]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavelet_qc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
